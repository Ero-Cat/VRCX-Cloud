[package]
name = "vrcx-0-server"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Self-hosted VRCX web server"

[[bin]]
name = "vrcx-0-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "tokio",
    "json",
    "ws",
] }
dirs = "7"
futures-util = "0.3"
rustls = { version = "0.23", features = ["aws_lc_rs"] }
thiserror = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true, features = ["derive"] }
sha2 = { workspace = true }
specta = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
toml = "0.9"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { workspace = true }
vrcx-0-application = { path = "../application" }
vrcx-0-application-game = { path = "../application-game" }
vrcx-0-contracts = { path = "../contracts" }
vrcx-0-application-activity = { path = "../application-activity" }
vrcx-0-application-core = { path = "../application-core" }
vrcx-0-application-realtime = { path = "../application-realtime" }
vrcx-0-application-sync = { path = "../application-sync" }
vrcx-0-assistant = { path = "../assistant" }
vrcx-0-composition = { path = "../composition" }
vrcx-0-core = { path = "../core" }
vrcx-0-mcp = { path = "../mcp" }
vrcx-0-persistence = { path = "../persistence" }
vrcx-0-platform = { path = "../platform" }
vrcx-0-runtime-host-server = { path = "../runtime-host-server" }
