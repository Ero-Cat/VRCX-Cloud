[package]
name = "vrcx-0-server"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Self-hosted VRCX web server"

[[bin]]
name = "vrcx-0-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
dirs = "7"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
toml = "0.9"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
vrcx-0-application-core = { path = "../application-core" }
vrcx-0-application-sync = { path = "../application-sync" }
vrcx-0-composition = { path = "../composition" }
vrcx-0-persistence = { path = "../persistence" }
vrcx-0-platform = { path = "../platform" }
vrcx-0-runtime-host-server = { path = "../runtime-host-server" }
