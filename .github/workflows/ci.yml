name: CI

on:
    push:
        branches:
            - master
    pull_request:
        types:
            - opened
            - synchronize
            - reopened
            - ready_for_review
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    changes:
        name: Detect Changes
        runs-on: ubuntu-latest
        timeout-minutes: 5
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        outputs:
            frontend: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.frontend }}
            rust: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.rust }}
        steps:
            - uses: actions/checkout@v7
            - uses: dorny/paths-filter@v4
              if: github.event_name != 'workflow_dispatch'
              id: filter
              with:
                  filters: |
                      frontend:
                        - '.github/actions/setup-node/**'
                        - '.github/workflows/ci.yml'
                        - '.oxfmtrc.json'
                        - '.oxlintrc.json'
                        - 'index.html'
                        - 'package.json'
                        - 'package-lock.json'
                        - 'public/**'
                        - 'scripts/**'
                        - 'src/**'
                        - 'tsconfig*.json'
                        - 'vite.config.*'
                        - 'vitest.config.*'
                      rust:
                        - '.cargo/**'
                        - '.github/actions/setup-rust/**'
                        - '.github/workflows/ci.yml'
                        - 'Cargo.lock'
                        - 'Cargo.toml'
                        - 'crates/**'
                        - 'deny.toml'

    frontend-checks:
        name: Frontend Checks
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs: changes
        if: needs.changes.outputs.frontend == 'true'
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup-node
            - run: npm run format:check
            - run: npm run lint
            - run: npm run typecheck

    frontend-build:
        name: Frontend Build
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs: changes
        if: needs.changes.outputs.frontend == 'true'
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup-node
            - run: npm run build

    frontend-test:
        name: Frontend Tests
        runs-on: ubuntu-latest
        timeout-minutes: 20
        needs: changes
        if: needs.changes.outputs.frontend == 'true' || (github.ref == 'refs/heads/master' && github.event_name == 'push')
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup-node
            - run: npm run test

    rust-checks:
        name: Rust Checks
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        needs: changes
        if: needs.changes.outputs.rust == 'true'
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup-rust
              with:
                  cache-key: ci-linux-clippy
                  save-cache: ${{ github.ref == 'refs/heads/master' && github.event_name == 'push' }}
            - run: npm run rust:fmt:check
            - run: npm run rust:clippy:ci
            - uses: taiki-e/install-action@cargo-deny
            - run: npm run rust:deny

    rust-test:
        name: Rust Tests
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        needs: changes
        if: needs.changes.outputs.rust == 'true'
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup-rust
              with:
                  cache-key: ci-linux-test
                  save-cache: ${{ github.ref == 'refs/heads/master' && github.event_name == 'push' }}
            - run: npm run rust:test:ci
