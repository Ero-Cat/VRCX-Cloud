name: deploy

# Publish the server image to GHCR on every push to master. Deployment
# servers pick it up by polling (scripts/auto-update.sh + deploy/*.timer);
# nothing here reaches into any server, and no secrets are needed — the
# built-in GITHUB_TOKEN scopes to this repo's packages only.
on:
    push:
        branches: [master]
    workflow_dispatch:

concurrency:
    group: deploy-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    packages: write

jobs:
    image:
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v5

            - uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # metadata-action lowercases the repo name into a valid
            # GHCR image path (Ero-Cat/VRCX-Cloud -> ero-cat/vrcx-cloud).
            # Single `latest` tag keeps package storage at one image.
            - name: Image tags
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=raw,value=latest

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
